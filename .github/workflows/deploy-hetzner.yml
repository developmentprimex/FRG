name: Deploy to Hetzner

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-hetzner
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 62.238.24.170
          username: root
          password: ${{ secrets.HETZNER_SSH_PASSWORD }}
          port: 22
          script: |
            set -e

            APP_DIR="/var/www/fragmento"
            FRONTEND_DIR="$APP_DIR/frontend"

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"

            echo "Before deploy:"
            git rev-parse --short HEAD
            git log -1 --oneline --no-decorate

            git fetch https://github.com/rinesaahmedi/fragmento.git main
            git reset --hard HEAD

            # A migration created directly on the server can later become tracked
            # upstream. Preserve those collisions outside the checkout before
            # merging; unrelated local files (including .env) stay in place.
            bash <<'BASH'
            set -euo pipefail
            umask 077
            BACKUP_BASE="/var/backups/fragmento-deploy"
            BACKUP_DIR=""
            git ls-tree -r --name-only -z FETCH_HEAD -- frontend/prisma/migrations |
              while IFS= read -r -d '' migration; do
                if { [ -f "$migration" ] || [ -L "$migration" ]; } &&
                   ! git ls-files --error-unmatch -- "$migration" >/dev/null 2>&1; then
                  if [ -z "$BACKUP_DIR" ]; then
                    mkdir -p "$BACKUP_BASE"
                    BACKUP_DIR=$(mktemp -d "$BACKUP_BASE/deploy-$(date -u +%Y%m%dT%H%M%SZ)-XXXXXX")
                  fi
                  mkdir -p "$BACKUP_DIR/$(dirname "$migration")"
                  mv -- "$migration" "$BACKUP_DIR/$migration"
                  printf 'Preserved untracked migration: %s\n' "$BACKUP_DIR/$migration"
                fi
              done
            BASH

            git merge --ff-only FETCH_HEAD

            echo "After deploy:"
            git rev-parse --short HEAD
            git log -1 --oneline --no-decorate

            # npm owns node_modules and can replace entries while installing. Do not
            # recurse into it here: dangling/stale package paths made chown fail and
            # stopped deployments before the database seed could run.
            find "$FRONTEND_DIR" -path "$FRONTEND_DIR/node_modules" -prune -o -exec chown deploy:deploy {} +

            cd "$FRONTEND_DIR"
            sudo -u deploy npm ci
            sudo -u deploy npm run geoip:update
            sudo -u deploy npm run prisma:deploy
            sudo -u deploy npm run prisma:generate
            # Preserve imported AB versions in Postgres; repeated deploys do not
            # replace a version already selected by an administrator.
            sudo -u deploy npm run seed:ab-documents
            sudo -u deploy npm run migrate:ab-pdfs
            # Seed is insert-only by default; never reconcile existing kitchens
            # during a normal deploy because their dashboard edits are live data.
            sudo -u deploy env SEED_RECONCILE_EXISTING=false npm run prisma:seed
            sudo -u deploy npm run catalog:link
            # Dependencies are freshly installed; discard cached absolute module
            # paths from previous Next.js builds without removing the live output.
            sudo -u deploy node -e 'require("node:fs").rmSync(".next/cache/webpack", { recursive: true, force: true })'
            sudo -u deploy npm run build

            # Install the daily report only on the hosted Hetzner server. The
            # report script itself also refuses to run unless this service sets
            # CONTRACT_ACCESS_REPORT_ENABLED=true.
            cat >/etc/systemd/system/fragmento-contract-access-report.service <<'EOF'
            [Unit]
            Description=Fragmento daily contract and ASC access reports
            After=network-online.target postgresql.service
            Wants=network-online.target

            [Service]
            Type=oneshot
            User=deploy
            WorkingDirectory=/var/www/fragmento/frontend
            Environment=NODE_ENV=production
            Environment=CONTRACT_ACCESS_REPORT_ENABLED=true
            Environment=CONTRACT_ACCESS_REPORT_EMAIL=it@forestdream.de,334primex.eu@gmail.com,01primex.eu@gmail.com
            # Dedicated sender credentials live outside the repository, root-only.
            EnvironmentFile=/etc/fragmento-contract-access-report.env
            ExecStart=/usr/bin/npm run report:contract-access
            EOF

            cat >/etc/systemd/system/fragmento-contract-access-report.timer <<'EOF'
            [Unit]
            Description=Run Fragmento contract and ASC access reports every day at 08:00 Europe/Berlin

            [Timer]
            OnCalendar=*-*-* 08:00:00 Europe/Berlin
            Persistent=true
            AccuracySec=1min
            Unit=fragmento-contract-access-report.service

            [Install]
            WantedBy=timers.target
            EOF

            # Daily processing reminders use the authenticated internal sender.
            # Optional dedicated credentials override the application .env files.
            cat >/etc/systemd/system/fragmento-work-reminders.service <<'EOF'
            [Unit]
            Description=Fragmento overdue claim reminders
            After=network-online.target postgresql.service
            Wants=network-online.target

            [Service]
            Type=oneshot
            User=deploy
            WorkingDirectory=/var/www/fragmento/frontend
            Environment=NODE_ENV=production
            Environment=WORK_REMINDERS_ENABLED=true
            EnvironmentFile=-/etc/fragmento-work-reminders.env
            ExecStart=/usr/bin/npm run report:work-reminders -- --send
            TimeoutStartSec=90
            EOF

            cat >/etc/systemd/system/fragmento-work-reminders.timer <<'EOF'
            [Unit]
            Description=Run Fragmento processing reminders at 09:00 Europe/Berlin

            [Timer]
            OnCalendar=*-*-* 09:00:00 Europe/Berlin
            Persistent=true
            AccuracySec=1min
            Unit=fragmento-work-reminders.service

            [Install]
            WantedBy=timers.target
            EOF

            systemctl daemon-reload
            systemctl enable --now fragmento-work-reminders.timer
            systemctl enable --now fragmento-contract-access-report.timer

            systemctl restart fragmento.service
            systemctl is-active fragmento.service
            systemctl --no-pager --full status fragmento.service | head -n 20

            curl --retry 12 --retry-delay 5 --retry-connrefused -I --max-time 20 http://127.0.0.1:5300/kitchens/ab-105806
            # Release legacy database copies only after the disk-aware app starts.
            sudo -u deploy npm run migrate:ab-pdfs -- --release-db-bytes

            cd "$APP_DIR"
            git status --short --branch
